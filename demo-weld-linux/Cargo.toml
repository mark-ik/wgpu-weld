[package]
name = "demo-weld-linux"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux demo: CEF accelerated OSR rendered into a wgpu surface via welding (DMABUF → Vulkan)"

[[bin]]
name = "demo-weld-linux"
path = "src/main.rs"

[dependencies]
welding = { path = "../welding", features = ["cef-runtime"] }
wgpu.workspace = true
winit.workspace = true
pollster = "0.4"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle.workspace = true
