[package]
name = "demo-weld-win"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows demo: CEF accelerated OSR rendered into a wgpu surface via weld"

[[bin]]
name = "demo-weld-win"
path = "src/direct.rs"

[[bin]]
name = "bundle-demo-weld-win"
path = "src/bundle.rs"

[lib]
name = "demo_weld_win"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
welding = { path = "../welding", features = ["cef-runtime"] }
wgpu.workspace = true
winit.workspace = true
pollster = "0.4"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
# raw-window-handle for the wgpu surface (winit 0.30 uses rwh 0.6)
raw-window-handle.workspace = true
cef = { version = "151", features = ["accelerated_osr", "build-util", "sandbox"] }
