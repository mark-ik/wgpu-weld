name: welding MSRV

# MSRV is a promise made to consumers at publication. It is verified when a
# release is cut and on demand, not on every push: running it per-push spent a
# nine-cell matrix re-answering an unchanged question, and its `-D warnings`
# lane went red whenever Rust 1.92 linted something the pinned 1.97.1 does not
# — a red badge with nothing to do behind it. Both of the last two failures of
# this workflow were of that kind or were caught minutes later by `wgpu
# matrix` anyway.

on:
  push:
    tags: ["v*", "welding-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    uses: merely-made/.github/.github/workflows/wgpu-msrv.yml@main
    with:
      crate: welding
      toolchain: 1.92.0
      rustflags: -D warnings
      # The tests are version-independent; exercise them on the MSRV anchor
      # rather than tripling the same suite for each compatibility row.
      test-row: wgpu-28

  # Local, and staying local: cef-dll-sys downloads the platform CEF
  # distribution and builds its native wrapper with CMake + Ninja. Keep this
  # distinct from the core library rows so a native-tooling failure is not
  # reported as an MSRV failure in the publishable Rust-only graph — the
  # version-check steps below exist to say which of the two it was.
  cef-runtime:
    name: Rust 1.92 / ${{ matrix.os }} / cef-runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Check CEF native build tools
        run: |
          cmake --version
          ninja --version
      # This is the released default wgpu-30 graph plus the optional CEF
      # integration. It intentionally does not combine wgpu-28/29/30.
      - name: Check the full default CEF graph
        run: cargo check --locked -p welding --lib --features cef-runtime
