name: headed hardware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headed-hardware-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTFLAGS: -D warnings

jobs:
  radv-wayland:
    name: RADV native Wayland pixel fixture
    runs-on: [self-hosted, wgpu-hardware, radv, wayland, headed]
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /home/markik/Code/targets/wgpu-weld-hardware
      CEF_CACHE_ROOT: /home/markik/Code/cef-cache/wgpu-weld
      XDG_RUNTIME_DIR: /run/user/1000
      WAYLAND_DISPLAY: wayland-0
      DISPLAY: ""
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      XDG_SESSION_TYPE: wayland
      XDG_CURRENT_DESKTOP: GNOME
      GDK_BACKEND: wayland
      WINIT_UNIX_BACKEND: wayland
      WGPU_BACKEND: vulkan
      RUST_LOG: info
      WELD_PIXEL_FIXTURE: "1"
      WELD_EXIT_AFTER_FRAMES: "2"
      WELD_TIMEOUT_SECS: "60"
      WELD_SWITCHES: ozone-platform=wayland

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Assert the native Wayland session
        run: |
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          test -z "${DISPLAY:-}"
          loginctl show-session 2 -p Active -p Type

      - name: Run deterministic CEF to DMA-BUF to wgpu gate
        run: |
          set -o pipefail
          export WELD_CACHE_ROOT="$RUNNER_TEMP/weld-radv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export WELD_PROFILE="$WELD_CACHE_ROOT/profile"
          mkdir -p "$WELD_PROFILE"
          export CEF_PATH="$CEF_CACHE_ROOT"
          cargo build --locked -p demo-weld-linux
          cef_archive="$(find "$CEF_CACHE_ROOT" -path '*/cef_linux_x86_64/archive.json' -type f | sort | tail -1)"
          test -n "$cef_archive"
          export CEF_PATH="${cef_archive%/archive.json}"
          export LD_LIBRARY_PATH="$CEF_PATH"
          "$CARGO_TARGET_DIR/debug/demo-weld-linux" 2>&1 | tee "$RUNNER_TEMP/weld-radv-wayland.log"
          grep -F "PIXEL FIXTURE PASS" "$RUNNER_TEMP/weld-radv-wayland.log"

  nvidia-dx12:
    name: NVIDIA RTX 4060 DX12 pixel fixture
    runs-on: [self-hosted, wgpu-hardware, nvidia, windows-x64, headed]
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: C:\Users\mark_\Code\targets\wgpu-weld-hardware
      CEF_CACHE_ROOT: C:\Users\mark_\Code\cef-cache\wgpu-weld
      WELD_PIXEL_FIXTURE: "1"
      WELD_EXIT_AFTER_FRAMES: "2"
      WELD_TIMEOUT_SECS: "60"
      RUST_LOG: info

    steps:
      - uses: actions/checkout@v4

      - name: Assert the provisioned Rust toolchain
        shell: powershell
        run: |
          rustc +1.97.1 --version
          cargo +1.97.1 --version

      - name: Record the physical adapter
        shell: powershell
        run: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader

      - name: Run deterministic CEF to DX12 to wgpu gate
        shell: powershell
        run: |
          $env:CEF_PATH = $env:CEF_CACHE_ROOT
          cargo +1.97.1 build --locked -p demo-weld-win
          $archive = Get-ChildItem -LiteralPath $env:CEF_CACHE_ROOT -Recurse -File -Filter 'archive.json' |
            Where-Object { $_.Directory.Name -eq 'cef_windows_x86_64' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $archive) { throw 'CEF distribution was not produced by cef-dll-sys' }
          $env:CEF_PATH = $archive.Directory.FullName
          & "$env:CARGO_TARGET_DIR\debug\demo-weld-win.exe" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\weld-nvidia-dx12.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Select-String -SimpleMatch 'PIXEL FIXTURE PASS' "$env:RUNNER_TEMP\weld-nvidia-dx12.log"

  metal-m4:
    name: Apple M4 Metal pixel fixture
    runs-on: [self-hosted, wgpu-hardware, metal, macos-arm64, m4, headed]
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: /Users/markik/Code/targets/wgpu-weld-hardware
      CEF_PATH: /Users/markik/Code/cef-cache/wgpu-weld
      WELD_PIXEL_FIXTURE: "1"
      WELD_EXIT_AFTER_FRAMES: "2"
      WELD_TIMEOUT_SECS: "60"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Ensure CEF native build tools
        run: |
          brew_bin="$(command -v brew || true)"
          if [ -z "$brew_bin" ]; then
            if [ -x /opt/homebrew/bin/brew ]; then brew_bin=/opt/homebrew/bin/brew; else brew_bin=/usr/local/bin/brew; fi
          fi
          "$brew_bin" list cmake >/dev/null 2>&1 || "$brew_bin" install cmake
          "$brew_bin" list ninja >/dev/null 2>&1 || "$brew_bin" install ninja
          echo "$("$brew_bin" --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build the CEF app bundle
        run: cargo run --locked -p demo-weld-mac --bin bundle-demo-weld-mac -- "$RUNNER_TEMP/bundle"
      - name: Run deterministic CEF to IOSurface to Metal gate
        run: |
          app="$RUNNER_TEMP/bundle/demo-weld-mac.app"
          receipt="$RUNNER_TEMP/weld-metal-m4.receipt"
          cache_root="$(mktemp -d "$RUNNER_TEMP/weld-metal-m4.XXXXXX")"
          mkdir -p "$cache_root/profile"
          stdout="$RUNNER_TEMP/weld-metal-m4.stdout.log"
          stderr="$RUNNER_TEMP/weld-metal-m4.stderr.log"
          open -W -n --stdout "$stdout" --stderr "$stderr" \
            --env "WELD_RECEIPT=$receipt" \
            --env "WELD_CACHE_ROOT=$cache_root" \
            --env "WELD_PROFILE=$cache_root/profile" \
            --env WELD_PIXEL_FIXTURE=1 \
            --env WELD_EXIT_AFTER_FRAMES=2 \
            --env WELD_TIMEOUT_SECS=60 \
            --env RUST_LOG=info \
            "$app"
          cat "$stdout"
          cat "$stderr"
          grep -F "pixel-fixture: PASS" "$receipt"

  metal-intel:
    name: Intel iMac Metal pixel fixture
    runs-on: [self-hosted, wgpu-hardware, metal, macos-x64, intel-mac, headed]
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: /Users/markik/Code/targets/wgpu-weld-hardware
      CEF_PATH: /Users/markik/Code/cef-cache/wgpu-weld
      WELD_PIXEL_FIXTURE: "1"
      WELD_EXIT_AFTER_FRAMES: "2"
      WELD_TIMEOUT_SECS: "60"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Ensure CEF native build tools
        run: |
          brew_bin="$(command -v brew || true)"
          if [ -z "$brew_bin" ]; then
            if [ -x /opt/homebrew/bin/brew ]; then brew_bin=/opt/homebrew/bin/brew; else brew_bin=/usr/local/bin/brew; fi
          fi
          "$brew_bin" list cmake >/dev/null 2>&1 || "$brew_bin" install cmake
          "$brew_bin" list ninja >/dev/null 2>&1 || "$brew_bin" install ninja
          echo "$("$brew_bin" --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build the CEF app bundle
        run: cargo run --locked -p demo-weld-mac --bin bundle-demo-weld-mac -- "$RUNNER_TEMP/bundle"
      - name: Run deterministic CEF to IOSurface to Metal gate
        run: |
          app="$RUNNER_TEMP/bundle/demo-weld-mac.app"
          receipt="$RUNNER_TEMP/weld-metal-intel.receipt"
          cache_root="$(mktemp -d "$RUNNER_TEMP/weld-metal-intel.XXXXXX")"
          mkdir -p "$cache_root/profile"
          stdout="$RUNNER_TEMP/weld-metal-intel.stdout.log"
          stderr="$RUNNER_TEMP/weld-metal-intel.stderr.log"
          open -W -n --stdout "$stdout" --stderr "$stderr" \
            --env "WELD_RECEIPT=$receipt" \
            --env "WELD_CACHE_ROOT=$cache_root" \
            --env "WELD_PROFILE=$cache_root/profile" \
            --env WELD_PIXEL_FIXTURE=1 \
            --env WELD_EXIT_AFTER_FRAMES=2 \
            --env WELD_TIMEOUT_SECS=60 \
            --env RUST_LOG=info \
            "$app"
          cat "$stdout"
          cat "$stderr"
          grep -F "pixel-fixture: PASS" "$receipt"
