name: wgpu matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: ${{ matrix.os }} / ${{ matrix.wgpu }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        wgpu: [wgpu-28, wgpu-29, wgpu-30]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p welding --lib --no-default-features --features ${{ matrix.wgpu }} -- -D warnings
      # The scaffold (non-cef-runtime) tests cover the version-independent
      # logic; one wgpu row per OS is enough to run them.
      - run: cargo test -p welding --no-default-features --features ${{ matrix.wgpu }}
        if: matrix.wgpu == 'wgpu-30'
