name: wgpu matrix

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: ${{ matrix.os }} / ${{ matrix.wgpu }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        wgpu: [wgpu-28, wgpu-29, wgpu-30]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - run: cargo clippy --locked -p welding --lib --no-default-features --features ${{ matrix.wgpu }} -- -D warnings
      # The scaffold (non-cef-runtime) tests cover the version-independent
      # logic; one wgpu row per OS is enough to run them.
      - run: cargo test --locked -p welding --no-default-features --features ${{ matrix.wgpu }}
        if: matrix.wgpu == 'wgpu-30'

  demo:
    name: ${{ matrix.os }} / ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: demo-weld-linux
          - os: macos-latest
            package: demo-weld-mac
          - os: windows-latest
            package: demo-weld-win

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Check the platform CEF demo
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p ${{ matrix.package }}
