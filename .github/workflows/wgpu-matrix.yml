name: wgpu matrix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # rustfmt, clippy across ubuntu/macOS/Windows x wgpu-28/29/30, and the
  # version-independent test suite on the wgpu-30 row. This was three inline
  # jobs before; the shared workflow is the same set of commands with the
  # toolchain read from rust-toolchain.toml instead of resolved as `stable`,
  # so a new stable release can no longer redden this repository on its own.
  gate:
    uses: merely-made/.github/.github/workflows/wgpu-check.yml@main
    with:
      crate: welding
      run-clippy: true
      run-fmt: true
      test-row: wgpu-30

  # Local, and staying local: each OS checks a DIFFERENT package, which is not
  # a shape the shared matrix expresses. These are the platform CEF demos.
  demo:
    name: ${{ matrix.os }} / ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: demo-weld-linux
          - os: macos-latest
            package: demo-weld-mac
          - os: windows-latest
            package: demo-weld-win

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Check the platform CEF demo
        env:
          RUSTFLAGS: -D warnings
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo check --locked -p ${{ matrix.package }}
