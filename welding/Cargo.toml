[package]
name = "welding"
version = "0.12.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/wgpu-weld"
description = "Embed Chromium Embedded Framework (CEF) into wgpu via accelerated off-screen rendering"
keywords = ["cef", "chromium", "wgpu", "webview", "osr"]
categories = ["rendering", "web-programming", "multimedia"]
readme = "README.md"

[features]
default = ["wgpu-30"]
# Pick the row matching the host's wgpu. The newest enabled row wins when
# features unify, so --all-features remains useful.
wgpu-30 = ["dep:wgpu_30", "dep:wgpu_hal_30", "grafting/wgpu-30"]
wgpu-29 = ["dep:wgpu_29", "dep:wgpu_hal_29", "grafting/wgpu-29"]
wgpu-28 = [
    "dep:wgpu_28",
    "dep:wgpu_hal_28",
    "dep:metal",
    "dep:foreign-types-shared",
    "grafting/wgpu-28",
]
# Real CEF integration via the `cef`/`cef-dll-sys` crate family.
# Enables the `cef` crate (which downloads / links libcef at build time via
# cef-dll-sys) and activates working implementations of CefRuntime and the
# platform producers. Without this feature the crate still compiles but all
# producer constructors return a pending-wiring error.
cef-runtime = ["dep:base64", "dep:cef", "dep:serde_json"]
# Enable the OnPaint CPU-bitmap fallback path. Always available regardless of
# GPU support, but requires a texture upload per frame.
cpu-paint-fallback = []

[dependencies]
dpi.workspace = true
log = "0.4"
thiserror = "2.0.17"
wgpu_30 = { package = "wgpu", version = "30.0.0", features = ["metal"], optional = true }
wgpu_hal_30 = { package = "wgpu-hal", version = "30.0.0", optional = true }
wgpu_29 = { package = "wgpu", version = "29.0.1", features = ["metal"], optional = true }
wgpu_hal_29 = { package = "wgpu-hal", version = "29.0.1", optional = true }
wgpu_28 = { package = "wgpu", version = "28.0.0", features = ["metal"], optional = true }
wgpu_hal_28 = { package = "wgpu-hal", version = "28.0.0", optional = true }
# CEF ABI layer: generated bindings + wrap_* handler macros + typed
# AcceleratedPaintInfo. Only active under the `cef-runtime` feature.
cef = { version = "151", features = ["accelerated_osr"], optional = true }
base64 = { version = "0.22", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
# Shared native-texture interop core. welding delegates its generic shared-texture
# import (OpenSharedHandle -> wgpu) to grafting instead of duplicating it; the
# CEF-specific callback copy + cache-flush stay in welding. Windows-only: it backs
# `native_frame::dx12` alone, and the Metal / DMABUF arms import through wgpu-hal
# directly. The welding wgpu-* feature forwards the matching grafting row;
# `default-features = false` drops grafting's GL producer path (surfman/glow).
grafting = { version = "0.5", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# wgpu-hal 28 exposes metal-rs handles; 29/30 expose objc2-metal handles. The
# importer converts only at the HAL boundary.
metal = { version = "0.33.0", optional = true }
foreign-types-shared = { version = "0.3.1", optional = true }
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-metal = { version = "0.3.2", features = [
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38.0"
libc = "0.2"
