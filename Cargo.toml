[workspace]
members = [
    "welding",
    "demo-weld-win",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mark-ik/wgpu-weld"
version = "0.1.0"

# Centralized load-bearing pins. Aligned with the wider Mere ecosystem
# (mere/Cargo.toml's workspace.dependencies).
[workspace.dependencies]
wgpu = "29"
winit = "0.30.13"
raw-window-handle = "0.6.2"
dpi = "0.1.2"
